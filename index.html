<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="assets/logo.webp">
<link rel="stylesheet" href="styles.css">
<title>THINK LINC</title>
</head>
<body>
<main class="phone splash" id="splash" aria-label="THINK LINC">
  <div class="statusbar" aria-hidden="true"><span class="statusbar__time">9:41</span><img src="assets/status-icons.svg" alt=""></div>
  <img class="splash__logo" src="assets/logo.webp" alt="THINK LINC · Sabka Sath Sabka Vikas" width="350" height="117">
  <p class="splash__hint">Tap to continue</p>
</main>
<script>
  // Splash → Login after 2.2s (or on tap)
  const go = () => {
    if (go.done) return; go.done = true;
    document.getElementById('splash').classList.add('is-leaving');
    setTimeout(() => location.href = 'login.html', 320);
  };
  setTimeout(go, 2200);
  document.getElementById('splash').addEventListener('click', go);
</script>
</body>
</html>
